spring.config.import=optional:file:.env[.properties]
spring.application.name=autoescola-api
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USERNAME}
spring.flyway.password=${DB_MIGRATION_PASSWORD}

api.security.token.secret=${JWT_SECRET}
app.bootstrap-admin.login=${AUTOESCOLA_ADMIN_LOGIN:}
app.bootstrap-admin.password=${AUTOESCOLA_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
integracao.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
autoescola.cancelamento.antecedencia-horas=${CANCELAMENTO_ANTECEDENCIA_HORAS:24}
